name: 发布版本

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 校验 tag 与 package.json 的 version 一致，避免发布版本号错位
      - name: 校验版本号
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag 版本 $TAG_VERSION 与 package.json 版本 $PKG_VERSION 不一致"
            exit 1
          fi

      # 索引构建依赖仓库内的嵌入式 Python，先确认它在检出后仍在
      - name: 校验嵌入式 Python
        shell: bash
        run: |
          test -f runtime/python/python.exe || { echo "::error::缺少 runtime/python/python.exe"; exit 1; }

      - name: 运行测试
        run: npm test

      # --publish never：交给下面的 action 发布，避免 electron-builder 自行发布导致冲突
      - name: 打包便携版
        run: npm run dist -- --publish never

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p artifacts
          cp dist/localhostSearch-Portable-*.exe artifacts/
          echo "== 待发布文件 =="
          ls -lh artifacts
          COUNT=$(ls -1 artifacts | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::预期 1 个产物，实际 $COUNT 个"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: localhostSearch-${{ github.ref_name }}
          path: artifacts/*
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: localhostSearch ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}